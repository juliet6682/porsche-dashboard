const $=s=>document.querySelector(s);
const wan=n=>n==null?'–':(n/1e4).toLocaleString('zh-TW',{maximumFractionDigits:1})+'萬';
const fmt=n=>n==null?'–':Math.round(n).toLocaleString('zh-TW');
const pct=n=>n==null?'–':(n*100).toFixed(1)+'%';
const BL=Object.fromEntries(D.brands);
const SFX=D.suffix||'';
const days=D.dates.length>1?(new Date(D.dates[D.dates.length-1])-new Date(D.dates[0]))/864e5:0;
// 指標：k 欄位、dir 1 越大越熱 / -1 越小越熱、ok 是否已有足夠資料
const M=[
 {k:'vpc',l:'關注度',d:'每台車每天被瀏覽幾次',w:30,dir:1,c:'#c92a2a',f:v=>v.toFixed(1)+' 次'},
 {k:'turn30',l:'週轉率',d:'30 天內賣掉（下架）的比例；快照滿 7 天才有',w:25,dir:1,c:'#2f9e44',f:pct,ok:days>=7},
 {k:'fresh',l:'流入活躍',d:'30 天內新上架占在架的比例，代表車商持續在進這款車',w:15,dir:1,c:'#1c7ed6',f:pct},

 {k:'dom_exit_med',l:'售出速度',d:'已下架車從上架到下架的天數中位數，越短越好；要 2 天以上快照',w:0,dir:-1,c:'#0c8599',f:v=>fmt(v)+' 天',ok:D.n_snap>1},
 {k:'stock',l:'市場規模',d:'在架台數，市場夠大才有代表性',w:10,dir:1,c:'#b8860b',f:v=>fmt(v)+' 台'},
 {k:'dealers',l:'車商廣度',d:'有幾家車商在賣，越多代表同業都在進',w:10,dir:1,c:'#e8590c',f:v=>fmt(v)+' 家'},

];
M.forEach(m=>{if(m.ok===undefined)m.ok=true;m.w0=m.w});
const W={};M.forEach(m=>W[m.k]=m.ok?m.w:0);

function weights(){
  $('#weights').innerHTML=M.map(m=>`<label style="${m.ok?'':'opacity:.45'}"><b style="color:${m.c}">■</b> <b>${m.l}</b> <span id="wv_${m.k}">${W[m.k]}</span>
  <input type="range" min="0" max="50" step="5" value="${W[m.k]}" data-k="${m.k}" ${m.ok?'':'disabled'}>
  <span class="d">${m.d}</span>${m.ok?'':'<br><span class="na">資料累積中，先不計分</span>'}</label>`).join('');
  $('#weights').querySelectorAll('input').forEach(i=>i.oninput=()=>{W[i.dataset.k]=+i.value;$('#wv_'+i.dataset.k).textContent=i.value;render()});
}
$('#reset').onclick=()=>{M.forEach(m=>W[m.k]=m.ok?m.w0:0);weights();render()};

function compute(){
  const min=+$('#minSel').value;
  const rows=D.rows[$('#dupSel').value].map(r=>Object.assign({},r,{fresh:r.stock?r.new30/r.stock:null,
    growth:D.n_snap>1&&(r.stock-r.stock_change)>0?r.stock_change/(r.stock-r.stock_change):null}));
  const el=rows.filter(r=>r.stock>=min);
  // 百分位：在全部品牌、達門檻的車款裡贏過幾 %（0–100），同分取平均名次
  M.forEach(m=>{const v=el.map(r=>r[m.k]).filter(x=>x!=null).sort((a,b)=>a-b);
    el.forEach(r=>{const x=r[m.k];if(x==null||v.length<2){r['s_'+m.k]=null;return}
      let lo=0,hi=v.length;while(lo<hi){const md=(lo+hi)>>1;if(v[md]<x)lo=md+1;else hi=md}
      let up=lo;while(up<v.length&&v[up]===x)up++;
      const p=((lo+up-1)/2)/(v.length-1);r['s_'+m.k]=Math.round((m.dir>0?p:1-p)*100)})});
  el.forEach(r=>{let s=0,w=0;M.forEach(m=>{const x=r['s_'+m.k];if(m.ok&&W[m.k]&&x!=null){s+=W[m.k]*x;w+=W[m.k]}});
    r.score=w?s/w:0;r.parts=M.map(m=>{const x=r['s_'+m.k];return m.ok&&W[m.k]&&x!=null&&w?W[m.k]*x/w:0})});
  el.sort((a,b)=>b.score-a.score).forEach((r,i)=>r.rank=i+1);
  return {all:rows,el};
}
function pass(r){const b=$('#brandSel').value,p=$('#priceSel').value;if(b&&r.b!==b)return false;
  if(p){const [lo,hi]=p.split('-').map(Number);if(r.price_med==null||r.price_med<lo*1e4||r.price_med>=hi*1e4)return false}return true}
const col=v=>v==null?'#f1f3f5':v>=80?'#c92a2a':v>=60?'#e8590c':v>=40?'#f59f00':'#ced4da';
const tc=v=>v!=null&&v>=40?'#fff':'#495057';
const link=r=>`dashboard_${r.b}_market${SFX}.html`;
const short=b=>(BL[b]||b).split(' ').slice(0,b==='land-rover'||b==='aston-martin'||b==='rolls-royce'?1:1)[0];

function render(){
  const {all,el}=compute();const show=el.filter(pass);
  const best=show[0];
  $('#kpis').innerHTML=[['車款總數',all.filter(pass).length+' 款',''],['參與排名',show.length+' 款',`在架 ${$('#minSel').value} 台以上`],
    ['目前第 1 名',best?best.kind:'–',best?`${BL[best.b]}・${best.score.toFixed(0)} 分`:''],['快照天數',D.n_snap+' 天',D.n_snap<7?'滿 7 天後加入週轉率':'']]
    .map(([l,v,s])=>`<div class="card kpi"><div class="l">${l}</div><div class="v" style="font-size:${String(v).length>10?'17px':'24px'}">${v}</div><div class="s">${s}</div></div>`).join('');
  $('#legend').innerHTML=M.filter(m=>m.ok&&W[m.k]).map(m=>`<span><i style="background:${m.c}"></i>${m.l} ${W[m.k]}</span>`).join('');
  $('#top').innerHTML=show.slice(0,20).map(r=>`<div class="toprow">
    <span style="color:var(--mute)">${r.rank}</span><a class="lk" href="${link(r)}" title="${BL[r.b]} ${r.kind}"><b>${r.kind}</b> <span style="color:var(--mute)">${short(r.b)}</span></a>
    <div class="bar">${r.parts.map((p,i)=>p?`<i title="${M[i].l} ${r['s_'+M[i].k]} 分" style="width:${p}%;background:${M[i].c}"></i>`:'').join('')}</div><b>${r.score.toFixed(0)}</b></div>`).join('')||'<div style="color:var(--mute)">沒有符合條件的車款</div>';
  // 品牌熱度
  const bs=D.brands.map(([b,l])=>{const x=el.filter(r=>r.b===b&&pass(Object.assign({},r,{b:$('#brandSel').value||r.b})));const n=x.reduce((s,r)=>s+r.stock,0);
    return {b,l,n:x.length,avg:n?x.reduce((s,r)=>s+r.score*r.stock,0)/n:0,top50:x.filter(r=>r.rank<=50).length,best:x[0]}}).filter(x=>x.n).sort((a,b)=>b.avg-a.avg);
  $('#brandTbl').innerHTML=`<thead><tr><th>品牌</th><th>熱度</th><th>排名車款</th><th>進前 50 名</th><th>最熱車款</th></tr></thead><tbody>${bs.map(x=>`<tr onclick="location.href='dashboard_${x.b}_market${SFX}.html'"><td><b>${x.l}</b></td>
    <td><span class="hot" style="background:${col(x.avg)};color:${tc(x.avg)}">${x.avg.toFixed(0)}</span></td><td>${x.n}</td><td>${x.top50}</td><td>${x.best.kind}（第 ${x.best.rank} 名）</td></tr>`).join('')}</tbody>`;
  // 全表
  const cols=[['rank','排名'],['b','品牌'],['kind','車型'],['score','綜合'],...M.filter(m=>m.ok).map(m=>['s_'+m.k,m.l]),['price_med','售價中位'],['year_med','年份中位']];
  const rows=[...show].sort((a,b)=>{const x=a[SORT.k]??-1e18,y=b[SORT.k]??-1e18;return (x>y?1:x<y?-1:0)*SORT.d});
  $('#tbl').innerHTML=`<thead><tr>${cols.map(([k,l])=>`<th data-k="${k}">${l}${SORT.k==k?(SORT.d>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr onclick="location.href='${link(r)}'">
    <td>${r.rank}</td><td class="bk">${short(r.b)}</td><td class="bk"><b>${r.kind}</b></td>
    <td><span class="hot" style="background:${col(r.score)};color:${tc(r.score)}">${r.score.toFixed(0)}</span></td>
    ${M.filter(m=>m.ok).map(m=>{const s=r['s_'+m.k];return `<td style="${W[m.k]?'':'opacity:.5'}"><span class="sc" style="background:${col(s)};color:${tc(s)}">${s??'–'}</span> <span style="color:var(--mute);font-size:11px">${r[m.k]==null?'':'('+m.f(r[m.k])+')'}</span></td>`}).join('')}
    <td>${wan(r.price_med)}</td><td>${r.year_med??'–'}</td></tr>`).join('')}</tbody>`;
  $('#tbl').querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;SORT={k,d:SORT.k==k?-SORT.d:(k=='rank'||k=='b'||k=='kind'?1:-1)};render()});
}
$('#note').innerHTML=`<b>熱門 = 有人看、賣得快、車商搶著進。</b>每項指標先換成「在全部 ${D.brands.length} 個品牌的車款裡，贏過幾 % 的車款」（0–100 分），再照權重加權平均成綜合分數。`+
  (D.n_snap<7?`<br>目前只有 ${D.n_snap} 天快照，<b>週轉率、售出速度、庫存成長還在累積</b>，先用關注度、流入活躍、在架天數、市場規模、車商廣度排名。每天早上 9 點自動更新；滿 2 天會出現售出速度、庫存成長，滿 7 天週轉率自動加入計分。`:'');
$('#method').innerHTML=M.map(m=>`<dt style="color:${m.c}">${m.l}（建議權重 ${m.w0}）</dt><dd>${m.d}${m.ok?'':'（資料累積中）'}</dd>`).join('')+
  `<dt>百分位分數</dt><dd>例如關注度 80 分 = 這款車每台的日瀏覽數，高於 80% 的車款。比較對象是全部品牌、在架達門檻的車款；選品牌或價格帶只是篩選顯示，分數不變。</dd>
  <dt>綜合分數</dt><dd>各指標分數 × 權重，除以有資料的權重總和；缺資料的指標不扣分。</dd>
  <dt>品牌熱度</dt><dd>該品牌排名車款的綜合分數，依在架台數加權平均。</dd>
  <dt>注意</dt><dd>在架太少的車款分數容易失真，預設 5 台以上才排名。超跑的每台瀏覽數通常偏高，用上方「價格帶」篩選同價位比較會比較公平。下架不一定是賣掉：重刊已排除，但車商撤下不賣的仍會算進週轉。</dd>`;
['#brandSel','#priceSel','#dupSel','#minSel'].forEach(s=>$(s).onchange=render);
weights();render();
</script></body></html>
